<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SofutoOtakuJP - Lisans Paneli</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#eee;min-height:100vh;padding:20px}
h1{text-align:center;font-size:2em;margin:20px 0;background:linear-gradient(90deg,#e94560,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.box{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);padding:25px;border-radius:15px;margin:15px auto;max-width:900px;border:1px solid rgba(255,255,255,0.1)}
h2{color:#e94560;margin-bottom:15px;font-size:1.3em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
input,select{padding:12px 15px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);color:#eee;font-size:14px;width:180px}
button{padding:12px 25px;border-radius:8px;border:none;background:linear-gradient(135deg,#e94560,#c23152);color:white;cursor:pointer;font-weight:bold;font-size:14px;transition:transform .2s}
button:hover{transform:scale(1.05)}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:12px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.1)}
th{background:rgba(233,69,96,0.2);color:#e94560}
.ok{color:#4ecca3}.no{color:#e94560}
.key{font-family:'Courier New',monospace;background:rgba(255,255,255,0.1);padding:6px 12px;border-radius:5px;user-select:all;letter-spacing:1px}
.stats{display:flex;gap:20px;justify-content:center;margin:20px 0}
.stat{text-align:center;padding:15px 30px;background:rgba(255,255,255,0.05);border-radius:10px}
.stat .num{font-size:2em;font-weight:bold;color:#e94560}
.stat .lbl{font-size:.8em;color:#888;margin-top:5px}
</style></head><body>
<h1>SofutoOtakuJP - Lisans Paneli</h1>
<div class="stats">
<div class="stat"><div class="num" id="toplam">0</div><div class="lbl">Toplam Anahtar</div></div>
<div class="stat"><div class="num" id="aktif">0</div><div class="lbl">Aktif</div></div>
<div class="stat"><div class="num" id="iptal">0</div><div class="lbl">Iptal</div></div>
</div>
<div class="box">
<h2>Yeni Anahtar Olustur</h2>
<div class="row">
<select id="paket"><option value="full">Full Paket</option><option value="basic">Basic Paket</option><option value="vip">VIP Paket</option></select>
<input type="number" id="cihaz" value="2" min="1" max="20" placeholder="Cihaz limiti">
<input type="number" id="gun" value="30" min="1" max="365" placeholder="Gun">
<button onclick="olustur()">Olustur</button>
</div>
<div id="sonuc" style="margin-top:15px;font-size:1.1em"></div>
</div>
<div class="box">
<h2>Anahtar Listesi</h2>
<button onclick="liste()" style="margin-bottom:10px">Yenile</button>
<div id="liste"></div>
</div>
<script>
function olustur(){
 fetch('/api/panel',{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify({islem:'olustur',paket:paket.value,cihaz_limiti:+cihaz.value,gun:+gun.value})})
 .then(r=>r.json()).then(d=>{
  sonuc.innerHTML='<span class="key">'+d.anahtar+'</span> <span class="ok">Olusturuldu!</span>';
  liste();
 });
}
function liste(){
 fetch('/api/panel',{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify({islem:'liste'})})
 .then(r=>r.json()).then(d=>{
  let t=0,a=0,i=0;
  let h='<table><tr><th>Anahtar</th><th>Paket</th><th>Cihaz</th><th>Bitis</th><th>Durum</th><th>Islem</th></tr>';
  for(let k in d){let v=d[k];t++;
   if(v.iptal)i++;else if(v.aktif)a++;
   let dur=v.iptal?'<span class="no">Iptal</span>':'<span class="ok">Aktif</span>';
   h+='<tr><td><span class="key">'+k+'</span></td><td>'+v.paket+'</td><td>'+(v.cihazlar?v.cihazlar.length:0)+'/'+v.cihaz_limiti+'</td><td>'+v.bitis+'</td><td>'+dur+'</td>';
   h+='<td>'+(v.iptal?'-':'<button onclick="iptal(\''+k+'\')">Iptal</button>')+'</td></tr>';
  }
  h+='</table>';
  document.getElementById('liste').innerHTML=t?h:'<p style="color:#888">Henuz anahtar yok</p>';
  toplam.textContent=t;aktif.textContent=a;iptal.textContent=i;
 });
}
function iptal(k){
 if(!confirm(k+' iptal edilsin mi?'))return;
 fetch('/api/panel',{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify({islem:'iptal',anahtar:k})}).then(()=>liste());
}
liste();
</script></body></html>
